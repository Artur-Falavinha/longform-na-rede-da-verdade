name: Validação e publicação

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_SITE_URL: https://na-rede-da-verdade.artur-falavinha.workers.dev/
  PUBLIC_POSTHOG_KEY: ""
  PUBLIC_POSTHOG_HOST: ""
  WRANGLER_SEND_METRICS: "false"

jobs:
  validar:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos e testes unitários
        run: |
          npm run check
          npm test
      - name: Validar build, conteúdo e publicação
        run: |
          npm run build
          npm run validate:content
          npm run validate:assets
          npx wrangler deploy --dry-run
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testar navegação, mídia e acessibilidade
        run: npm run test:e2e -- --project=desktop --project=mobile
      - name: Guardar evidências de falhas
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidencias-playwright
          path: |
            tmp/test-results
            tmp/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  publicar:
    name: Publicar na Cloudflare
    needs: validar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências e gerar versão
        run: |
          npm ci
          npm run build
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync('dist/release.json', JSON.stringify({ commit: process.env.GITHUB_SHA }) + '\n');"
      - name: Conferir se a revisão ainda é a ponta da main
        id: atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publicar=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Publicação substituída por uma revisão mais recente da main.'
          fi
      - name: Publicar versão validada
        if: steps.atual.outputs.publicar == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2526a86dea7f4ef0caf1d7dc71e681f8"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Cadastre o secret CLOUDFLARE_API_TOKEN da conta pessoal.'
            exit 1
          fi
          npx wrangler deploy
      - name: Conferir versão e entrega de mídia
        if: steps.atual.outputs.publicar == 'true'
        run: node scripts/verify-deployment.mjs "$PUBLIC_SITE_URL" "$GITHUB_SHA"
